name: Run Telegram Bot

on:
  push:
    branches: [ main, master ]
  schedule:
    # Перезапуск каждые 5 часов, чтобы GitHub Actions не сбрасывал long-running таски
    - cron: '0 */5 * * *'
  workflow_dispatch: # Позволяет запускать бота вручную кнопкой из вкладки Actions

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Чеккаут кода из репозитория
        uses: actions/checkout@v4

      - name: Настройка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install aiogram aiohttp

      - name: Запуск бота
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python bot.py
